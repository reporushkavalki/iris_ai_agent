<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Iris</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{height:100%;margin:0;background:#07051a;color:#c9c4ee;font-family:"Segoe UI",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
  img{width:96px;height:96px;animation:p 2.2s ease-in-out infinite}
  @keyframes p{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
  h1{margin:0;font-size:15px;letter-spacing:.35em;font-weight:600;color:#fff}
  p{margin:0;font-size:13px;opacity:.7;max-width:420px;line-height:1.5}
  #err{display:none;color:#ff9aa8;opacity:1}
</style></head>
<body>
  <img src="iris.png" alt="">
  <h1>IRIS</h1>
  <p id="msg">Starting up&hellip;</p>
  <p id="err"></p>
<script>
  window.irisFail = function (m) {
    document.getElementById('msg').style.display = 'none';
    var e = document.getElementById('err'); e.style.display = 'block'; e.textContent = m;
  };
</script>
</body></html>
